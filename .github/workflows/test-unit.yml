name: Unit

on:
  pull_request:
  push:
  schedule:
    - cron: '0 0/2 * * *'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mvorisek/image-php:${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        type: ['Phpunit', 'Phpunit Lowest']
        i: [0, 1, 2, 3, 4, 5]
        j: [0, 1, 2]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.type == 'Phpunit Lowest' && 'latest' || '2017-latest' }}
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: atk4_pass
        options: --user root --health-cmd="/opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -C -U sa -P atk4_pass -b -Q 'SELECT 1' || /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -C -U sa -P atk4_pass -b -Q 'SELECT 1'" --health-interval=60s --health-timeout=30s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
