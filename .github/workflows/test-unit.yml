name: Unit

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mvorisek/image-php:${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        type: ['Phpunit', 'Phpunit Lowest']
        # include:
        #   - php: 'latest'
        #     type: 'Phpunit Burn'
    env:
      LOG_COVERAGE: "${{ fromJSON('{true: \"1\", false: \"\"}')[matrix.php == '8.5' && matrix.type == 'Phpunit' && (github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')))] }}"
    services:
      oracle:
        image: gvenzl/${{ matrix.type == 'Phpunit Lowest' && 'oracle-free:slim-faststart' || 'oracle-xe:18-slim-faststart' }}
        env:
          ORACLE_PASSWORD: atk4_pass_root
          APP_USER: atk4_test_user
          APP_USER_PASSWORD: atk4_pass
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure PHP
        run: |
          if [ -n "$LOG_COVERAGE" ]; then echo "xdebug.mode=coverage" >> /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini; else rm /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini; fi
          php --version

      - name: Setup cache 1/2
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Setup cache 2/2
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.type }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: |
          if [ "${{ matrix.type }}" != "Phpunit" ] && [ "${{ matrix.type }}" != "Phpunit Lowest" ] && [ "${{ matrix.type }}" != "Phpunit Burn" ]; then composer remove --no-interaction --no-update phpunit/phpunit ergebnis/phpunit-slow-test-detector --dev; fi
          if [ "${{ matrix.type }}" != "CodingStyle" ]; then composer remove --no-interaction --no-update friendsofphp/php-cs-fixer ergebnis/composer-normalize --dev; fi
          if [ "${{ matrix.type }}" != "StaticAnalysis" ]; then composer remove --no-interaction --no-update phpstan/\* --dev; fi
          if [ -n "$LOG_COVERAGE" ]; then composer require --no-interaction --no-install phpunit/phpcov; fi
          composer update --ansi --prefer-dist --no-interaction --no-progress --optimize-autoloader
          if [ "${{ matrix.type }}" = "Phpunit Lowest" ] && [ "${{ matrix.php >= 8.5 }}" != "false" ]; then composer require --no-interaction --no-update phpunit/phpunit:^11.3 --dev; fi
          if [ "${{ matrix.type }}" = "Phpunit Lowest" ]; then composer update --ansi --prefer-dist --prefer-lowest --prefer-stable --no-interaction --no-progress --optimize-autoloader; fi
          if [ "${{ matrix.type }}" = "Phpunit Burn" ]; then sed -i 's~public function runBare(): void~public function runBare(): void { gc_collect_cycles(); $memDiffs = array_fill(0, '"$(if [ \"$GITHUB_EVENT_NAME\" == \"schedule\" ]; then echo 64; else echo 4; fi)"', 0); $emitter = Event\\Facade::emitter(); for ($i = -1; $i < count($memDiffs); ++$i) { $this->_runBare(); if ($this->inIsolation) { $dispatcher = \\Closure::bind(static fn () => $emitter->dispatcher, null, Event\\DispatchingEmitter::class)(); if ($i === -1) { $dispatcherEvents = $dispatcher->flush()->asArray(); } else { $dispatcher->flush(); } foreach ($dispatcherEvents as $event) { $dispatcher->dispatch($event); } } gc_collect_cycles(); $mem = memory_get_usage(); if ($i !== -1) { $memDiffs[$i] = $mem - $memPrev; } $memPrev = $mem; rsort($memDiffs); if (array_sum($memDiffs) >= 4096 * 1024 || $memDiffs[2] > 0) { $e = new AssertionFailedError("Memory leak detected! (" . implode(" + ", array_map(static fn ($v) => number_format($v / 1024, 3, ".", " "), array_filter($memDiffs))) . " KB, " . ($i + 2) . " iterations)"); $this->status = TestStatus::failure($e->getMessage()); $emitter->testFailed($this->valueObjectForEvents(), Event\\Code\\ThrowableBuilder::from($e), Event\\Code\\ComparisonFailureBuilder::from($e)); $this->onNotSuccessfulTest($e); } } } private function _runBare(): void~' vendor/phpunit/phpunit/src/Framework/TestCase.php && cat vendor/phpunit/phpunit/src/Framework/TestCase.php | grep '_runBare('; fi

      - name: Init
        run: |
          php -r '(new PDO("pgsql:host=postgres;dbname=atk4_test", "atk4_test_user", "atk4_pass"))->exec("ALTER ROLE atk4_test_user CONNECTION LIMIT 1");'
          /usr/lib/oracle/setup.sh
          if [ -n "$LOG_COVERAGE" ]; then mkdir coverage; echo "memory_limit = 192M" > /usr/local/etc/php/conf.d/custom-memory-limit.ini; fi

      - name: "Wait for Oracle"
        run: |
          for i in {1..60}; do
            if php -r '
              $conn = @oci_connect("atk4_test_user", "atk4_pass", "//oracle/freepdb1");
              if ($conn) {
                oci_close($conn);
                exit(0);
              }
              exit(1);
            '
            then
              echo "Oracle is ready"
              exit 0
            fi

            echo "Waiting for Oracle... ($i/60)"
            sleep 2
          done

          echo "Oracle did not become ready"
          exit 1

      - name: "Prepare Oracle statistics collector"
        if: success() || failure()
        env:
          ORACLE_ADMIN_PASSWORD: atk4_pass_root
        run: |
          mkdir -p oracle-stats

          cat > /tmp/oracle-stats.php <<'PHP'
          <?php

          declare(strict_types=1);

          $outputFile = $argv[1] ?? null;

          if ($outputFile === null) {
              fwrite(STDERR, "Usage: oracle-stats.php <output-file>\n");
              exit(1);
          }

          $conn = @oci_connect(
              'system',
              getenv('ORACLE_ADMIN_PASSWORD'),
              '//oracle/freepdb1'
          );

          if (!$conn) {
              $e = oci_error();
              fwrite(STDERR, "Oracle admin connection failed:\n");
              fwrite(STDERR, print_r($e, true));
              exit(1);
          }

          function queryRows($conn, string $sql): array
          {
              $stmt = oci_parse($conn, $sql);

              if (!$stmt) {
                  throw new RuntimeException(
                      'oci_parse() failed: ' . print_r(oci_error($conn), true)
                  );
              }

              if (!oci_execute($stmt)) {
                  $e = oci_error($stmt);

                  throw new RuntimeException(
                      "Oracle query failed:\n$sql\n" . print_r($e, true)
                  );
              }

              $rows = [];

              while (($row = oci_fetch_assoc($stmt)) !== false) {
                  $rows[] = $row;
              }

              oci_free_statement($stmt);

              return $rows;
          }

          $data = [
              'timestamp' => date('c'),

              'version' => queryRows(
                  $conn,
                  'SELECT banner_full FROM v$version'
              ),

              'parameters' => queryRows(
                  $conn,
                  <<<'SQL'
                  SELECT
                      name,
                      value
                  FROM v$parameter
                  WHERE name IN (
                      'memory_target',
                      'memory_max_target',
                      'sga_target',
                      'sga_max_size',
                      'pga_aggregate_target',
                      'pga_aggregate_limit',
                      'open_cursors',
                      'session_cached_cursors',
                      'processes',
                      'sessions',
                      'optimizer_mode'
                  )
                  ORDER BY name
                  SQL
              ),

              'resource_limits' => queryRows(
                  $conn,
                  <<<'SQL'
                  SELECT
                      resource_name,
                      current_utilization,
                      max_utilization,
                      limit_value
                  FROM v$resource_limit
                  WHERE resource_name IN (
                      'processes',
                      'sessions',
                      'transactions'
                  )
                  ORDER BY resource_name
                  SQL
              ),

              'sga' => queryRows(
                  $conn,
                  <<<'SQL'
                  SELECT
                      component,
                      current_size,
                      min_size,
                      max_size
                  FROM v$sga_dynamic_components
                  ORDER BY component
                  SQL
              ),

              'sysstat' => queryRows(
                  $conn,
                  <<<'SQL'
                  SELECT
                      name,
                      value
                  FROM v$sysstat
                  WHERE name IN (
                      'parse count (total)',
                      'parse count (hard)',
                      'execute count',
                      'user calls',
                      'user commits',
                      'user rollbacks',
                      'session logical reads',
                      'physical reads',
                      'physical reads direct',
                      'CPU used by this session',
                      'DB time',
                      'SQL*Net roundtrips to/from client',
                      'bytes sent via SQL*Net to client',
                      'bytes received via SQL*Net from client'
                  )
                  ORDER BY name
                  SQL
              ),

              'wait_events' => queryRows(
                  $conn,
                  <<<'SQL'
                  SELECT
                      event,
                      wait_class,
                      total_waits,
                      total_timeouts,
                      time_waited_micro
                  FROM v$system_event
                  WHERE wait_class <> 'Idle'
                  ORDER BY time_waited_micro DESC
                  SQL
              ),
            'top_sql_cpu' => queryRows(
                $conn,
                <<<'SQL'
                SELECT
                    sql_id,
                    executions,
                    parse_calls,
                    loads,
                    invalidations,
                    buffer_gets,
                    disk_reads,
                    rows_processed,
                    cpu_time,
                    elapsed_time,
                    application_wait_time,
                    concurrency_wait_time,
                    user_io_wait_time,
                    cluster_wait_time,
                    SUBSTR(sql_text, 1, 1000) AS sql_text
                FROM v$sql
                WHERE parsing_schema_name = 'ATK4_TEST_USER'
                ORDER BY cpu_time DESC
                FETCH FIRST 100 ROWS ONLY
                SQL
            ),

            'top_sql_buffer_gets' => queryRows(
                $conn,
                <<<'SQL'
                SELECT
                    sql_id,
                    executions,
                    parse_calls,
                    loads,
                    invalidations,
                    buffer_gets,
                    disk_reads,
                    rows_processed,
                    cpu_time,
                    elapsed_time,
                    SUBSTR(sql_text, 1, 1000) AS sql_text
                FROM v$sql
                WHERE parsing_schema_name = 'ATK4_TEST_USER'
                ORDER BY buffer_gets DESC
                FETCH FIRST 100 ROWS ONLY
                SQL
            ),
          ];

          file_put_contents(
              $outputFile,
              json_encode(
                  $data,
                  JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES
              ) . "\n"
          );

          echo "Oracle statistics saved to $outputFile\n";

          foreach ($data['version'] as $row) {
              echo $row['BANNER_FULL'] . "\n";
          }

          oci_close($conn);
          PHP

      - name: "Oracle stats: before PDO"
        if: (success() || failure()) && (env.LOG_COVERAGE || github.event_name == 'schedule')
        env:
          ORACLE_ADMIN_PASSWORD: atk4_pass_root
        run: |
          php /tmp/oracle-stats.php oracle-stats/pdo-before.json

      - name: "Run tests: Oracle - PDO (only for coverage or cron)"
        if: (success() || failure()) && (env.LOG_COVERAGE || github.event_name == 'schedule')
        env:
          DB_DSN: "pdo_oci:dbname=oracle/freepdb1"
          DB_USER: atk4_test_user
          DB_PASSWORD: atk4_pass
          NLS_LANG: AMERICAN_AMERICA.AL32UTF8
        run: |
          php -d opcache.enable_cli=1 vendor/bin/phpunit --exclude-group none $(if [ -n "$LOG_COVERAGE" ]; then echo --coverage-text; else echo --no-coverage; fi) --fail-on-warning --fail-on-risky $(if vendor/bin/phpunit --version | grep -q '^PHPUnit 9\.'; then echo -v; else echo --fail-on-notice --fail-on-deprecation --display-notices --display-deprecations --display-warnings --display-errors --display-incomplete --display-skipped; fi)
          if [ -n "$LOG_COVERAGE" ]; then mv coverage/phpunit.cov coverage/phpunit-oracle-pdo.cov; fi

      - name: "Oracle stats: after PDO"
        if: (success() || failure()) && (env.LOG_COVERAGE || github.event_name == 'schedule')
        env:
          ORACLE_ADMIN_PASSWORD: atk4_pass_root
        run: |
          php /tmp/oracle-stats.php oracle-stats/pdo-after.json

          php <<'PHP'
          <?php

          function loadStats(string $file): array
          {
              return json_decode(
                  file_get_contents($file),
                  true,
                  512,
                  JSON_THROW_ON_ERROR
              );
          }

          $before = loadStats('oracle-stats/pdo-before.json');
          $after = loadStats('oracle-stats/pdo-after.json');

          echo "\n";
          echo "============================================================\n";
          echo "Oracle PDO statistics delta\n";
          echo "============================================================\n";

          $beforeStats = [];

          foreach ($before['sysstat'] as $row) {
              $beforeStats[$row['NAME']] = (float) $row['VALUE'];
          }

          foreach ($after['sysstat'] as $row) {
              $name = $row['NAME'];
              $value = (float) $row['VALUE'];
              $delta = $value - ($beforeStats[$name] ?? 0);

              printf(
                  "%-45s %15.3f\n",
                  $name,
                  $delta
              );
          }

          echo "\n";
          echo "Wait event deltas:\n";
          echo "------------------------------------------------------------\n";

          $beforeWaits = [];

          foreach ($before['wait_events'] as $row) {
              $beforeWaits[$row['EVENT']] = [
                  'total_waits' => (float) $row['TOTAL_WAITS'],
                  'total_timeouts' => (float) $row['TOTAL_TIMEOUTS'],
                  'time_waited_micro' => (float) $row['TIME_WAITED_MICRO'],
                  'wait_class' => $row['WAIT_CLASS'],
              ];
          }

          $waitDeltas = [];

          foreach ($after['wait_events'] as $row) {
              $event = $row['EVENT'];

              $old = $beforeWaits[$event] ?? [
                  'total_waits' => 0,
                  'total_timeouts' => 0,
                  'time_waited_micro' => 0,
                  'wait_class' => $row['WAIT_CLASS'],
              ];

              $waits = (float) $row['TOTAL_WAITS'] - $old['total_waits'];
              $timeouts = (float) $row['TOTAL_TIMEOUTS'] - $old['total_timeouts'];
              $time = (float) $row['TIME_WAITED_MICRO'] - $old['time_waited_micro'];

              if ($waits > 0 || $time > 0) {
                  $waitDeltas[$event] = [
                      'wait_class' => $row['WAIT_CLASS'],
                      'waits' => $waits,
                      'timeouts' => $timeouts,
                      'seconds' => $time / 1_000_000,
                  ];
              }
          }

          uasort(
              $waitDeltas,
              static fn (array $a, array $b): int =>
                  $b['seconds'] <=> $a['seconds']
          );

          foreach ($waitDeltas as $event => $stats) {
              printf(
                  "%-50s %12.3f s  %10.0f waits  %s\n",
                  $event,
                  $stats['seconds'],
                  $stats['waits'],
                  $stats['wait_class']
              );
          }

          echo "============================================================\n";
          PHP

      - name: "Oracle stats: before OCI8"
        if: success() || failure()
        env:
          ORACLE_ADMIN_PASSWORD: atk4_pass_root
        run: |
          php /tmp/oracle-stats.php oracle-stats/oci8-before.json

      - name: "Run tests: Oracle - OCI8"
        if: success() || failure()
        env:
          DB_DSN: "oci8:dbname=oracle/freepdb1"
          DB_USER: atk4_test_user
          DB_PASSWORD: atk4_pass
          NLS_LANG: AMERICAN_AMERICA.AL32UTF8
        run: |
          php -d opcache.enable_cli=1 vendor/bin/phpunit --exclude-group none $(if [ -n "$LOG_COVERAGE" ]; then echo --coverage-text; else echo --no-coverage; fi) --fail-on-warning --fail-on-risky $(if vendor/bin/phpunit --version | grep -q '^PHPUnit 9\.'; then echo -v; else echo --fail-on-notice --fail-on-deprecation --display-notices --display-deprecations --display-warnings --display-errors --display-incomplete --display-skipped; fi)
          if [ -n "$LOG_COVERAGE" ]; then mv coverage/phpunit.cov coverage/phpunit-oracle-oci8.cov; fi

      - name: "Oracle stats: after OCI8"
        if: success() || failure()
        env:
          ORACLE_ADMIN_PASSWORD: atk4_pass_root
        run: |
          php /tmp/oracle-stats.php oracle-stats/oci8-after.json

          php <<'PHP'
          <?php

          function loadStats(string $file): array
          {
              return json_decode(
                  file_get_contents($file),
                  true,
                  512,
                  JSON_THROW_ON_ERROR
              );
          }

          $before = loadStats('oracle-stats/oci8-before.json');
          $after = loadStats('oracle-stats/oci8-after.json');

          echo "\n";
          echo "============================================================\n";
          echo "Oracle OCI8 statistics delta\n";
          echo "============================================================\n";

          $beforeStats = [];

          foreach ($before['sysstat'] as $row) {
              $beforeStats[$row['NAME']] = (float) $row['VALUE'];
          }

          foreach ($after['sysstat'] as $row) {
              $name = $row['NAME'];
              $value = (float) $row['VALUE'];
              $delta = $value - ($beforeStats[$name] ?? 0);

              printf(
                  "%-45s %15.3f\n",
                  $name,
                  $delta
              );
          }

          echo "\n";
          echo "Wait event deltas:\n";
          echo "------------------------------------------------------------\n";

          $beforeWaits = [];

          foreach ($before['wait_events'] as $row) {
              $beforeWaits[$row['EVENT']] = [
                  'total_waits' => (float) $row['TOTAL_WAITS'],
                  'total_timeouts' => (float) $row['TOTAL_TIMEOUTS'],
                  'time_waited_micro' => (float) $row['TIME_WAITED_MICRO'],
                  'wait_class' => $row['WAIT_CLASS'],
              ];
          }

          $waitDeltas = [];

          foreach ($after['wait_events'] as $row) {
              $event = $row['EVENT'];

              $old = $beforeWaits[$event] ?? [
                  'total_waits' => 0,
                  'total_timeouts' => 0,
                  'time_waited_micro' => 0,
                  'wait_class' => $row['WAIT_CLASS'],
              ];

              $waits = (float) $row['TOTAL_WAITS'] - $old['total_waits'];
              $timeouts = (float) $row['TOTAL_TIMEOUTS'] - $old['total_timeouts'];
              $time = (float) $row['TIME_WAITED_MICRO'] - $old['time_waited_micro'];

              if ($waits > 0 || $time > 0) {
                  $waitDeltas[$event] = [
                      'wait_class' => $row['WAIT_CLASS'],
                      'waits' => $waits,
                      'timeouts' => $timeouts,
                      'seconds' => $time / 1_000_000,
                  ];
              }
          }

          uasort(
              $waitDeltas,
              static fn (array $a, array $b): int =>
                  $b['seconds'] <=> $a['seconds']
          );

          foreach ($waitDeltas as $event => $stats) {
              printf(
                  "%-50s %12.3f s  %10.0f waits  %s\n",
                  $event,
                  $stats['seconds'],
                  $stats['waits'],
                  $stats['wait_class']
              );
          }

          echo "============================================================\n";
          PHP

      - name: "Upload Oracle statistics"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-stats-${{ matrix.type }}
          path: oracle-stats/
          retention-days: 3
