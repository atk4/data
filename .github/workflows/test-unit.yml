name: Unit

on:
  pull_request:
  push:
  schedule:
    - cron: '0 0/2 * * *'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mvorisek/image-php:${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        type: ['Phpunit', 'Phpunit Lowest']
        i: [0, 1, 2, 3, 4, 5]
        j: [0, 1, 2]
    services:
      mysql:
        # supported versions: 8.0.21+, 8.1+
        image: mysql:${{ matrix.type == 'Phpunit Lowest' && 'latest' || '8.0' }}
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5 -e MYSQL_ROOT_PASSWORD=atk4_pass_root -e MYSQL_USER=atk4_test_user -e MYSQL_PASSWORD=atk4_pass -e MYSQL_DATABASE=atk4_test
      mysql5:
        # supported versions: 5.6.36+, 5.7.15+
        image: mysql:${{ matrix.type == 'Phpunit Lowest' && '5' || '5.6' }}
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5 -e MYSQL_ROOT_PASSWORD=atk4_pass_root -e MYSQL_USER=atk4_test_user -e MYSQL_PASSWORD=atk4_pass -e MYSQL_DATABASE=atk4_test
      mariadb:
        # supported versions: 10.2.22+, 10.3.10+, 10.4.3+, 10.5.3+, 10.6.9+, 10.7.5+, 10.8.4+, 10.9+
        image: mariadb:${{ matrix.type == 'Phpunit Lowest' && 'latest' || '10.2' }}
        options: --health-cmd="mysqladmin ping || mariadb-admin ping" --health-interval=10s --health-timeout=5s --health-retries=5 -e MYSQL_ROOT_PASSWORD=atk4_pass_root -e MYSQL_USER=atk4_test_user -e MYSQL_PASSWORD=atk4_pass -e MYSQL_DATABASE=atk4_test
      postgres:
        image: postgres:${{ matrix.type == 'Phpunit Lowest' && 'alpine' || '12-alpine' }}
        env:
          POSTGRES_USER: atk4_test_user
          POSTGRES_PASSWORD: atk4_pass
          POSTGRES_DB: atk4_test
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=5
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.type == 'Phpunit Lowest' && 'latest' || '2017-latest' }}
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: atk4_pass
        options: --health-cmd="/opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -C -U sa -P atk4_pass -b -Q 'SELECT 1' || /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -C -U sa -P atk4_pass -b -Q 'SELECT 1'" --health-interval=10s --health-timeout=5s --health-retries=5
      oracle:
        image: gvenzl/${{ matrix.type == 'Phpunit Lowest' && 'oracle-free:slim-faststart' || 'oracle-xe:18-slim-faststart' }}
        env:
          ORACLE_PASSWORD: atk4_pass_root
          APP_USER: atk4_test_user
          APP_USER_PASSWORD: atk4_pass
    steps:
      - name: Checkout
        uses: actions/checkout@v4
